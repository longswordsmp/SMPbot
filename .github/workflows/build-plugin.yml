name: Build TotemGuardians

on:
  push:
    paths:
      - 'minecraft-plugin/TotemGuardians/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        working-directory: minecraft-plugin/TotemGuardians
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: TotemGuardians-jar
          path: minecraft-plugin/TotemGuardians/target/TotemGuardians-*.jar
          if-no-files-found: error

      - name: Jar checksum
        working-directory: minecraft-plugin/TotemGuardians
        run: |
          jar=$(ls target/TotemGuardians-*.jar)
          echo "JAR_NAME=$(basename "$jar")"
          echo "JAR_BYTES=$(stat -c%s "$jar")"
          echo "JAR_SHA256=$(sha256sum "$jar" | cut -d' ' -f1)"
          echo "-----BEGIN JAR BASE64-----"
          base64 -w 400 "$jar"
          echo "-----END JAR BASE64-----"
